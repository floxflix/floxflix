services:
  floxflix:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: floxflix:all-in-one
    ports:
      - "7777:7777"
    environment:
      - MONGO_URI=mongodb://mongo:27017/floxflix
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY, e.g. export JWT_SECRET_KEY=$(openssl rand -base64 48)}
      - UPLOAD_FOLDER=/app/uploads
      - PORT=7777
      - SERVE_UI=true
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  api:
    profiles: ["api-only"]
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        VERSION: ${VERSION:-dev}
    image: floxflix:api
    ports:
      - "7778:7777"
    environment:
      - MONGO_URI=mongodb://mongo:27017/floxflix
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY, e.g. export JWT_SECRET_KEY=$(openssl rand -base64 48)}
      - UPLOAD_FOLDER=/app/uploads
      - PORT=7777
      - SERVE_UI=false
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8.2.7
    volumes:
      - ./mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  uploads:
